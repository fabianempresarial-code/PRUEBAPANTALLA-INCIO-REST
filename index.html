<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Tamarindo - Loop Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f1d592;
            --dark: #020617;
            --neon-green: #22c55e;
            --glass-opacity: rgba(15, 23, 42, 0.75); 
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        #custom-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; background-size: cover; background-position: center;
            transition: opacity 2s ease-in-out; filter: brightness(0.35);
        }

        .overlay-motion {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: linear-gradient(135deg, rgba(2, 6, 23, 0.8) 0%, rgba(30, 41, 59, 0.4) 100%);
            backdrop-filter: blur(8px);
        }

        header {
            height: 14vh; display: flex; justify-content: space-between; align-items: center;
            padding: 0 3%; background: rgba(0,0,0,0.9); border-bottom: 3px solid var(--gold); z-index: 10;
        }

        .brand-zone { display: flex; align-items: center; gap: 20px; flex: 1; }
        .logo-container img { max-height: 70px; filter: drop-shadow(0 0 10px var(--gold)); }
        .clock-wrapper { transform: scale(0.65); transform-origin: left center; }

        .marquee-container {
            flex: 1; overflow: hidden; white-space: nowrap;
            margin-left: 20px; border-left: 1px solid rgba(212, 175, 55, 0.3); padding-left: 20px;
        }

        #phrase-marquee {
            display: inline-block; font-size: 1.6rem; font-weight: 800;
            color: var(--gold-light); text-transform: uppercase;
            animation: marquee 25s linear infinite;
        }

        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .day-badge {
            background: var(--gold); color: var(--dark); padding: 8px 25px;
            border-radius: 5px; font-weight: 800; font-size: 1.4rem; box-shadow: 0 0 20px var(--gold);
        }

        main { flex: 1; overflow: hidden; display: flex; align-items: center; }

        .menu-track {
            display: flex; width: max-content;
            animation: scrollLoop 45s linear infinite;
        }

        @keyframes scrollLoop { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .card {
            background: var(--glass-opacity); border: 2px solid rgba(34, 197, 94, 0.3);
            border-radius: 35px; margin: 0 25px; width: 450px; height: 520px;
            overflow: hidden; display: flex; flex-direction: column;
            backdrop-filter: blur(10px); animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating { 0%, 100% { transform: translateY(0) rotate(-0.5deg); } 50% { transform: translateY(-15px) rotate(0.5deg); } }

        .img-container { width: 100%; height: 50%; overflow: hidden; border-bottom: 2px solid var(--gold); position: relative; background: #000; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: opacity 1.5s ease-in-out; animation: slowZoom 12s linear infinite alternate; }
        @keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.15); } }

        .info { padding: 20px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .content { font-size: 1.9rem; font-weight: 800; line-height: 1.2; color: var(--neon-green); text-shadow: 0 0 12px rgba(34, 197, 94, 0.5); }
        .menu-list { list-style: none; padding: 0; margin: 0; }
        .menu-list li { margin-bottom: 6px; text-transform: capitalize; }

        footer { height: 10vh; background: var(--gold); color: var(--dark); display: flex; justify-content: space-around; align-items: center; font-weight: 800; font-size: 2rem; z-index: 10; }
    </style>
</head>
<body>

    <div id="custom-bg"></div>
    <div class="overlay-motion"></div>

    <header>
        <div class="brand-zone">
            <div class="logo-container"><img src="https://i.imgur.com/fDhqQvk.jpeg" alt="Logo"></div>
            <div class="clock-wrapper">
                <script src="https://cdn.logwork.com/widget/digital.js"></script>
                <a href="https://logwork.com/current-time-in-bogota-colombia" class="digital-clock" data-style="style2" data-size="250" data-timezone="America/Bogota" data-language="en">Time</a>
            </div>
            <div class="marquee-container"><span id="phrase-marquee">Bienvenidos a Tamarindo...</span></div>
        </div>
        <div id="label-dia" class="day-badge">...</div>
    </header>

    <main><div id="menu-track" class="menu-track"></div></main>

    <footer>
        <div>MESA: $15.000</div>
        <div>DOMICILIO: $16.000</div>
        <div style="font-size: 1.1rem;">📍 Cra 11 # 64 - 10 | Parque Lourdes</div>
    </footer>

    <script>
        const CONFIG = {
            csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS29H3hxA9X8VcqQqGZlT4duXOIT3xAdIhExEIut9frN0i78naYSj6gnWFkWliWwKNLT5tGNlaYh16j/pub?output=csv",
            defaultImg: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1000",
            defaultBg: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?q=80&w=1500"
        };

        let lastDataString = "";
        let imageOptions = [];
        let phraseOptions = [];

        async function startApp() {
            await updateData(); 
            setInterval(updateData, 30000); 
            setInterval(shuffleVisuals, 15000); 
        }

        async function updateData() {
            try {
                const res = await fetch(`${CONFIG.csvUrl}&nocache=${Date.now()}`);
                const text = await res.text();
                
                if (text === lastDataString) return;
                lastDataString = text;

                const rows = text.split('\n').map(row => row.split(',').map(c => c.trim()));
                const dias = ["DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"];
                const hoy = dias[new Date().getDay()];
                
                const currentData = rows.find(r => r[0] && r[0].toUpperCase() === hoy) || rows[1];
                imageOptions = rows.filter(r => r[0] && r[0].toLowerCase().includes("imagenes"));
                
                // SOLUCIÓN FRASES: Filtro mejorado para encontrar la fila "FRASES"
                phraseOptions = rows
                    .filter(r => r[0] && r[0].toUpperCase().replace(/\s/g, '') === "FRASES")
                    .flatMap(row => row.slice(1).filter(c => c !== ""));

                updateUI(currentData);
                updatePhrase(); // Forzar actualización de frase al cargar datos
            } catch (e) { console.error("Error al sincronizar:", e); }
        }

        function updateUI(data) {
            document.getElementById('label-dia').innerText = ["DOMINGO", "LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES", "SABADO"][new Date().getDay()];
            
            const cats = [
                { title: 'Principios', content: data[1], col: 1 },
                { title: 'Proteínas', content: data[2], col: 2 },
                { title: 'Acompañantes', content: data[3], col: 3 },
                { title: 'Bebida', content: data[5] || "Jugo Natural", col: 5 }
            ];

            const track = document.getElementById('menu-track');
            
            if (track.innerHTML === "") {
                const cardsHtml = cats.map((cat, i) => {
                    const listHtml = formatList(cat.content);
                    const initialImg = imageOptions.length > 0 ? (imageOptions[0][cat.col] || CONFIG.defaultImg) : CONFIG.defaultImg;
                    return `
                        <div class="card">
                            <div class="img-container"><img class="cat-img-${i}" src="${initialImg}"></div>
                            <div class="info">
                                <h2 style="color: var(--gold-light); font-size: 0.9rem; letter-spacing: 3px; margin-bottom:10px;">${cat.title.toUpperCase()}</h2>
                                <div class="content" id="data-text-${i}">${listHtml}</div>
                            </div>
                        </div>`;
                }).join('');
                track.innerHTML = cardsHtml + cardsHtml; 
                
                const bgImgs = imageOptions.map(f => f[0]).filter(img => img && img.startsWith('http'));
                document.getElementById('custom-bg').style.backgroundImage = `url('${bgImgs[0] || CONFIG.defaultBg}')`;
            } else {
                cats.forEach((cat, i) => {
                    const elements = document.querySelectorAll(`[id="data-text-${i}"]`);
                    const newList = formatList(cat.content);
                    elements.forEach(el => {
                        if (el.innerHTML !== newList) el.innerHTML = newList;
                    });
                });
            }
        }

        function formatList(rawText) {
            if (!rawText) return '---';
            const items = rawText.split('-').map(it => it.trim()).filter(it => it !== "");
            return `<ul class="menu-list">${items.map(it => `<li>${it}</li>`).join('')}</ul>`;
        }

        function updatePhrase() {
            const marquee = document.getElementById('phrase-marquee');
            if (phraseOptions && phraseOptions.length > 0) {
                const nuevaFrase = phraseOptions[Math.floor(Math.random() * phraseOptions.length)];
                // Solo actualiza si la frase es distinta para evitar saltos visuales innecesarios
                if (marquee.innerText !== nuevaFrase) {
                    marquee.innerText = nuevaFrase;
                }
            } else {
                marquee.innerText = "Sabor casero con amor | Tamarindo";
            }
        }

        function shuffleVisuals() {
            if (imageOptions.length === 0) return;
            const rand = Math.floor(Math.random() * 6);
            
            if (rand === 0) { 
                const bg = document.getElementById('custom-bg');
                const bgImgs = imageOptions.map(f => f[0]).filter(img => img && img.startsWith('http'));
                if(bgImgs.length > 0) {
                    bg.style.opacity = 0.2;
                    setTimeout(() => {
                        bg.style.backgroundImage = `url('${bgImgs[Math.floor(Math.random() * bgImgs.length)]}')`;
                        bg.style.opacity = 1;
                    }, 1500);
                }
            } else if (rand === 5) {
                updatePhrase();
            } else { 
                const idx = rand - 1;
                const colIndices = [1, 2, 3, 5];
                const imgs = document.querySelectorAll(`.cat-img-${idx}`);
                const options = imageOptions.map(f => f[colIndices[idx]]).filter(img => img && img.startsWith('http'));
                if (options.length > 0) {
                    const nextImg = options[Math.floor(Math.random() * options.length)];
                    imgs.forEach(img => img.style.opacity = 0);
                    setTimeout(() => {
                        imgs.forEach(img => { img.src = nextImg; img.style.opacity = 1; });
                    }, 1500);
                }
            }
        }

        startApp();
    </script>
</body>
</html>
